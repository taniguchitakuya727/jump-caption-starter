<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jump Caption Tools</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fa;
        --surface: #ffffff;
        --ink: #17202a;
        --muted: #627080;
        --line: #d8dee7;
        --accent: #19786f;
        --accent-strong: #0f5e57;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 7vw, 4.6rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin-top: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      a.card {
        display: grid;
        gap: 10px;
        min-height: 150px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 22px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
      }

      a.card:hover {
        border-color: var(--accent);
      }

      .card strong {
        color: var(--accent-strong);
        font-size: 1.08rem;
      }

      .card span {
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jump Caption Tools</h1>
      <p>
        書き起こし済みの字幕を共有・修正するための補助ページです。
        音声/動画ファイルとSRTをブラウザで読み込み、修正版を書き出せます。
      </p>
      <div class="grid">
        <a class="card" href="./online-editor/">
          <strong>オンライン字幕エディタ</strong>
          <span>Googleドライブで共有された音声/動画とSRTを読み込んで、友人が字幕を修正できます。</span>
        </a>
        <a class="card" href="./google_drive_friend_workflow.html">
          <strong>Googleドライブ共有手順</strong>
          <span>あなたがSRTを作り、友人に修正してもらうための流れを確認できます。</span>
        </a>
      </div>
    </main>
  </body>
</html>
