<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jump Caption</title>
    <link rel="stylesheet" href="/static/style.css?v=sprint4-playhead-split" />
    <script src="/static/app.js?v=sprint4-playhead-split" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="header-block">
          <p class="eyebrow">Local video helper</p>
          <h1 id="app-title">Jump Caption</h1>
          <p class="lead">
            動画ファイルを選択し、ローカル環境の FFmpeg 利用可否を確認します。
          </p>
        </div>

        <div class="tool-grid">
          <section class="panel" aria-labelledby="video-heading">
            <h2 id="video-heading">動画ファイル</h2>
            <form id="jump-cut-form">
              <label class="file-picker">
                <span class="file-picker-title">ファイルを選択</span>
                <span class="file-picker-meta" id="selected-file">未選択</span>
                <input
                  id="video-file"
                  name="file"
                  type="file"
                  accept="video/*,audio/*,.mp4,.mov,.mkv,.avi,.m4v,.mp3,.m4a,.wav"
                  required
                />
              </label>

              <div class="settings-grid">
                <label>
                  <span>無音判定音量</span>
                  <input
                    name="silence_threshold_db"
                    type="number"
                    value="-35"
                    max="-1"
                    step="1"
                  />
                </label>
                <label>
                  <span>最短無音時間</span>
                  <input
                    name="min_silence_duration"
                    type="number"
                    value="0.5"
                    min="0.1"
                    step="0.1"
                  />
                </label>
                <label>
                  <span>残す余白</span>
                  <input
                    name="retained_margin"
                    type="number"
                    value="0.15"
                    min="0"
                    step="0.05"
                  />
                </label>
              </div>

              <button id="process-video" type="submit">ジャンプカット</button>
            </form>
          </section>

          <section class="panel" aria-labelledby="ffmpeg-heading">
            <div class="panel-heading">
              <h2 id="ffmpeg-heading">FFmpeg</h2>
              <button id="refresh-ffmpeg" type="button">再確認</button>
            </div>
            <dl class="status-list">
              <div>
                <dt>状態</dt>
                <dd id="ffmpeg-available">確認中</dd>
              </div>
              <div>
                <dt>パス</dt>
                <dd id="ffmpeg-path">-</dd>
              </div>
              <div>
                <dt>バージョン</dt>
                <dd id="ffmpeg-version">-</dd>
              </div>
            </dl>
            <p class="error-text" id="ffmpeg-error" hidden></p>
          </section>

          <section class="panel" aria-labelledby="whisper-heading">
            <div class="panel-heading">
              <h2 id="whisper-heading">Whisper</h2>
              <button id="refresh-whisper" type="button">再確認</button>
            </div>
            <dl class="status-list">
              <div>
                <dt>状態</dt>
                <dd id="whisper-available">確認中</dd>
              </div>
              <div>
                <dt>モデル</dt>
                <dd id="whisper-model">small</dd>
              </div>
              <div>
                <dt>言語</dt>
                <dd id="whisper-language">ja</dd>
              </div>
            </dl>
            <p class="error-text" id="whisper-note" hidden></p>
          </section>
        </div>

        <section class="panel result-panel" aria-labelledby="result-heading">
          <h2 id="result-heading">処理結果</h2>
          <div class="result-links" id="result-links" hidden></div>
          <form id="subtitle-form" class="subtitle-form" hidden>
            <div class="settings-grid">
              <label>
                <span>Whisperモデル</span>
                <select name="model_size">
                  <option value="small" selected>small</option>
                  <option value="base">base</option>
                  <option value="tiny">tiny</option>
                  <option value="medium">medium</option>
                </select>
              </label>
              <label>
                <span>字幕言語</span>
                <select name="language">
                  <option value="ja" selected>日本語</option>
                  <option value="en">English</option>
                  <option value="auto">自動検出</option>
                </select>
              </label>
            </div>
            <button id="generate-subtitles" type="submit">字幕生成</button>
          </form>
          <div class="result-links" id="subtitle-links" hidden></div>
          <p class="error-text" id="process-error" hidden></p>
          <pre id="process-log" aria-live="polite">待機中</pre>
        </section>

        <section class="panel library-panel" aria-labelledby="library-heading">
          <div class="panel-heading">
            <h2 id="library-heading">続きから</h2>
            <button id="refresh-library" type="button">更新</button>
          </div>
          <div class="library-grid">
            <section aria-labelledby="library-videos-heading">
              <h3 id="library-videos-heading">カット動画</h3>
              <div class="library-list" id="video-library">読み込み中</div>
            </section>
            <section aria-labelledby="library-subtitles-heading">
              <h3 id="library-subtitles-heading">字幕</h3>
              <div class="library-list" id="subtitle-library">読み込み中</div>
            </section>
          </div>
        </section>

        <section class="panel editor-panel" id="subtitle-editor" hidden>
          <div class="editor-heading">
            <h2>字幕エディタ</h2>
            <div class="save-state" id="save-state">未保存</div>
          </div>

          <div class="editor-layout">
            <div class="preview-column">
              <div class="video-preview-wrap">
                <video id="video-preview" controls></video>
                <div id="caption-overlay" class="caption-overlay" hidden></div>
              </div>
              <div class="editor-actions">
                <button id="add-segment" type="button">追加</button>
                <button id="delete-segment" type="button">削除</button>
                <button id="split-segment" type="button">分割</button>
                <button id="merge-segment" type="button">結合</button>
                <button id="undo-edit" type="button">Undo</button>
                <button id="redo-edit" type="button">Redo</button>
                <button id="save-subtitles" type="button">保存</button>
                <button id="format-subtitles" type="button">字幕整形</button>
              </div>
              <div class="format-row">
                <label>
                  <span>1行</span>
                  <input id="format-max-chars" type="number" value="18" min="8" max="40" />
                </label>
                <label>
                  <span>最短</span>
                  <input id="format-min-duration" type="number" value="0.8" min="0.2" step="0.1" />
                </label>
                <label>
                  <span>最長</span>
                  <input id="format-max-duration" type="number" value="5.5" min="1" step="0.5" />
                </label>
              </div>
              <div class="replace-row">
                <input id="search-text" type="search" placeholder="検索" />
                <input id="replace-text" type="text" placeholder="置換" />
                <button id="replace-all" type="button">置換</button>
              </div>
            </div>

            <div class="subtitle-table-wrap">
              <table class="subtitle-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>開始</th>
                    <th>終了</th>
                    <th>本文</th>
                  </tr>
                </thead>
                <tbody id="subtitle-rows"></tbody>
              </table>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
