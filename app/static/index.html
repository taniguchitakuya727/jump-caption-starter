<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jump Caption</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="header-block">
          <p class="eyebrow">Local video helper</p>
          <h1 id="app-title">Jump Caption</h1>
          <p class="lead">
            動画ファイルを選択し、ローカル環境の FFmpeg 利用可否を確認します。
          </p>
        </div>

        <div class="tool-grid">
          <section class="panel" aria-labelledby="video-heading">
            <h2 id="video-heading">動画ファイル</h2>
            <form id="jump-cut-form">
              <label class="file-picker">
                <span class="file-picker-title">ファイルを選択</span>
                <span class="file-picker-meta" id="selected-file">未選択</span>
                <input
                  id="video-file"
                  name="file"
                  type="file"
                  accept="video/*,audio/*,.mp4,.mov,.mkv,.avi,.m4v,.mp3,.m4a,.wav"
                  required
                />
              </label>

              <div class="settings-grid">
                <label>
                  <span>無音判定音量</span>
                  <input
                    name="silence_threshold_db"
                    type="number"
                    value="-35"
                    max="-1"
                    step="1"
                  />
                </label>
                <label>
                  <span>最短無音時間</span>
                  <input
                    name="min_silence_duration"
                    type="number"
                    value="0.5"
                    min="0.1"
                    step="0.1"
                  />
                </label>
                <label>
                  <span>残す余白</span>
                  <input
                    name="retained_margin"
                    type="number"
                    value="0.15"
                    min="0"
                    step="0.05"
                  />
                </label>
              </div>

              <button id="process-video" type="submit">ジャンプカット</button>
            </form>
          </section>

          <section class="panel" aria-labelledby="ffmpeg-heading">
            <div class="panel-heading">
              <h2 id="ffmpeg-heading">FFmpeg</h2>
              <button id="refresh-ffmpeg" type="button">再確認</button>
            </div>
            <dl class="status-list">
              <div>
                <dt>状態</dt>
                <dd id="ffmpeg-available">確認中</dd>
              </div>
              <div>
                <dt>パス</dt>
                <dd id="ffmpeg-path">-</dd>
              </div>
              <div>
                <dt>バージョン</dt>
                <dd id="ffmpeg-version">-</dd>
              </div>
            </dl>
            <p class="error-text" id="ffmpeg-error" hidden></p>
          </section>
        </div>

        <section class="panel result-panel" aria-labelledby="result-heading">
          <h2 id="result-heading">処理結果</h2>
          <div class="result-links" id="result-links" hidden></div>
          <p class="error-text" id="process-error" hidden></p>
          <pre id="process-log" aria-live="polite">待機中</pre>
        </section>
      </section>
    </main>
  </body>
</html>
