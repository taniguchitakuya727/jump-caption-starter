[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jump-caption"
version = "0.1.0"
description = "Local FastAPI starter for Jump Caption."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "faster-whisper==1.1.1",
  "ctranslate2==4.4.0",
  "h11>=0.14,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
